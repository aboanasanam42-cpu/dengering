name: Build, Sign & Release Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Sign Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Prepare Secrets & Environment (.env)
        run: |
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> app/.env

      - name: Decode Keystore
        if: "${{ secrets.KEYSTORE_BASE64 != '' }}"
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > "$GITHUB_WORKSPACE/release-keystore.jks"
          mkdir -p app
          cp "$GITHUB_WORKSPACE/release-keystore.jks" app/release-keystore.jks
          echo "Keystore successfully decoded."

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true

      - name: Build and Sign APK with Gradle
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          KEYSTORE_PATH: ${{ github.workspace }}/release-keystore.jks
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -f "gradlew" ]; then
            ./gradlew assembleRelease --stacktrace || ./gradlew assembleDebug --stacktrace
          else
            gradle assembleRelease --stacktrace || gradle assembleDebug --stacktrace
          fi

      - name: Sign APK (if unaligned/unsigned release)
        if: "${{ secrets.KEYSTORE_BASE64 != '' && secrets.KEYSTORE_PASSWORD != '' }}"
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        continue-on-error: true

      - name: Locate Final APK
        id: find_apk
        run: |
          # Check signed APK first, then any release or debug APK
          APK_PATH=$(find app/build/outputs/apk/ -type f -name "*signed*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find app/build/outputs/apk/ -type f -name "*.apk" | head -n 1)
          fi
          echo "Selected APK path: $APK_PATH"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MathSolver-APK
          path: ${{ steps.find_apk.outputs.apk_path }}
          retention-days: 14

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.find_apk.outputs.apk_path }}
          name: Release ${{ github.ref_name }}
          body: |
            ## 📐 تطبيق حلول الرياضيات المتطورة (Math Solver)
            - **تصميم وبرمجة:** الدكتور / مالك الرميمة (هاتف: 771124103)
            - **فكرة:** أ/ محمد الرميمة
            - **مصحح فكرة:** أ/ مطهر الرميمة

            ---
            ### 🚀 الميزات المتوفرة في هذا الإصدار:
            - **الأسس والجذور**: تبسيط الجذور التربيعية والتكعيبية وحل المعادلات الأسية خطوة بخطوة.
            - **النسب المثلثية**: حساب الوتر (نظرية فيثاغورس)، زوايا الارتفاع، جا، جتا، وظا، مع رسم بياني تفاعلي للمثلث القائم.
            - **تشابه المثلثات**: حساب معاملات التشابه، تناسب الأطوال، والمحيطات مع مخطط هندسي توضيحي.
            - **النسبة والتناسب**: حل التناسب والضرب التبادلي والتقسيم التناسبي التلقائي.
            - **تصدير النتائج**:
              - 📄 تصدير تقرير بصيغة **PDF** جاهز للمشاركة والطباعة.
              - 📊 تصدير جدول بيانات **Excel (.csv)** متوافق تماماً مع اللغة العربية (UTF-8 BOM).
              - 💬 إرسال الحل مباشرة عبر **واتساب** للرقم 771124103 أو أي رقم آخر.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
