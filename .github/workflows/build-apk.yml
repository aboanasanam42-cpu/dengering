name: Build, Sign & Release Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Sign Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Prepare Environment
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          printf 'GEMINI_API_KEY=%s\n' "$GEMINI_API_KEY" > .env
          cp .env app/.env
          echo "Standalone build configured; Firebase/google-services.json is not required."

      - name: Decode Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "ERROR: KEYSTORE_BASE64 is missing."; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "ERROR: KEYSTORE_PASSWORD is missing."; exit 1; }
          test -n "$KEY_ALIAS" || { echo "ERROR: KEY_ALIAS is missing."; exit 1; }

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/release-keystore.jks"
          test -s "$GITHUB_WORKSPACE/release-keystore.jks" || { echo "ERROR: decoded keystore is empty."; exit 1; }

          echo "Checking that KEY_ALIAS exists in the keystore..."
          keytool -list -keystore "$GITHUB_WORKSPACE/release-keystore.jks" \
            -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo "Release keystore and alias verified."

      - name: Grant execute permission for Gradle wrapper
        run: |
          test -f gradlew || { echo "ERROR: gradlew is missing from repository root."; exit 1; }
          chmod +x gradlew

      - name: Build signed Release APK
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          KEYSTORE_PATH: ${{ github.workspace }}/release-keystore.jks
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew clean assembleRelease --stacktrace

      - name: Verify generated APK
        id: find_apk
        run: |
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: Expected release APK was not generated."
            find app/build/outputs -type f -name '*.apk' -print || true
            exit 1
          fi
          echo "APK generated: $APK_PATH"
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MathSolver-APK
          path: ${{ steps.find_apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.find_apk.outputs.apk_path }}
          name: Release ${{ github.ref_name }}
          body: |
            ## 📐 تطبيق حلول الرياضيات المتطورة (Math Solver)
            - **تصميم وبرمجة:** الدكتور / مالك الرميمة
            - **فكرة:** أ/ محمد الرميمة
            - **مصحح فكرة:** أ/ مطهر الرميمة

            ### المزايا
            - الأسس والجذور
            - النسب المثلثية
            - تشابه المثلثات
            - النسبة والتناسب
            - تصدير PDF
            - تصدير Excel
            - مشاركة الحل عبر واتساب
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
